name = "chicken-kds"
main = "src/index.js"
compatibility_date = "2026-10-01"
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/api/*", "/ws"] }

[[d1_databases]]
binding = "DB"
database_name = "chicken_kds"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "OrderRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderRoom"]
