name = "chicken-kds"
main = "src/index.js"
compatibility_date = "2026-10-01"
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/api/*", "/ws"] }

[[d1_databases]]
binding = "DB"
database_name = "chicken_kds"
database_id = "82bc303c-98c0-4701-9a5d-bbf703a2bb6d"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "OrderRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderRoom"]

[observability]
enabled = true
head_sampling_rate = 1
