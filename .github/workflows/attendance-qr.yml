name: Attendance QR checks
on:
  push:
    branches: [fix/workload-compact-date-picker]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run check:syntax
      - run: node --check public/attendance-ui.js
      - run: npm test
