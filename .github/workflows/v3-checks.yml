name: V3 code checks
on:
  push:
    branches: [feature/v3-multistore-foundation]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:syntax
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_v3_migrations.py' -v
