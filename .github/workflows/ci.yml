name: CI

on:
  push:
    branches:
      - main
      - feature/v3-multistore-foundation
      - feature/kitchen-dag-quick-order
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run check:syntax
      - run: npm test
